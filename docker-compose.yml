version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-multi-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./backups:/app/backups
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Riyadh
